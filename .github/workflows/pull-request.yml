name: PR Checks

on:
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint

  test-unit:
    needs: [ lint ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: npm run test
      # - name: Unit tests with coverage
      #   run: npm run test:coverage
      # - name: Upload unit coverage
      #   uses: actions/upload-artifact@v7
      #   if: always()
      #   with:
      #     name: unit-coverage
      #     path: coverage/
      #     retention-days: 7

  test-e2e:
    needs: [ lint ]
    runs-on: ubuntu-latest
    environment: integration
    env:
      VITE_ENV_NAME: integration
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  status-comment:
    needs: [ lint, test-unit, test-e2e ]
    runs-on: ubuntu-latest
    if: always() && needs.test-unit.result == 'success' && needs.test-e2e.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR success
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## CI Checks Passed

            | Job | Status |
            |-----|--------|
            | Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Unit Tests | ${{ needs.test-unit.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | E2E Tests | ${{ needs.test-e2e.result == 'success' && '✅ Passed' || '❌ Failed' }} |

            All checks passed. This PR is ready for review.
